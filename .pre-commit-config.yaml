# Pre-commit hook configuration. See https://pre-commit.com/ for docs.
# Contributor setup: README.md > Contributing.

repos:
  - repo: local
    hooks:
      # The three image hooks go through scripts/run-if-available.sh. They are
      # `language: system`, so without the binary pre-commit fails outright
      # instead of skipping, and the usual response to that is --no-verify,
      # which disables every other check too. The wrapper skips locally with a
      # note and hard-fails in CI, where the tools are installed explicitly.
      - id: jpegoptim
        name: jpegoptim (compress JPEGs to q=85, strip metadata)
        entry: scripts/run-if-available.sh jpegoptim --max=85 --strip-all --preserve --all-progressive
        language: system
        types: [jpeg]

      - id: oxipng
        name: oxipng (lossless PNG optimization)
        entry: scripts/run-if-available.sh oxipng --opt 4 --strip safe
        language: system
        types: [png]

      # No SVG minification hook. svgo is a node tool and was the last thing
      # forcing node into this pipeline. It was not earning that: the repo
      # has two SVGs, and plab_logo_dark.svg was already excluded because
      # svgo stripped clipPath/overflow attributes it needed and broke the
      # home-page background. That left one already-minified file behind an
      # `npm install -g`.
      #
      # If SVG optimisation is wanted again, scour is the Python equivalent
      # — but check the rendered logos before trusting it, given the above.

      # Runs after the compression hooks so it sees post-compression sizes.
      - id: image-size-cap
        name: image-size-cap (warn >500 KB, block >1 MB)
        entry: python3 scripts/check_image_size.py
        language: system
        types_or: [image, svg]

      - id: image-refs
        name: image-refs (verify internal image paths resolve)
        entry: python3 scripts/check_image_refs.py
        language: system
        types_or: [html, markdown]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.svg$'
      - id: end-of-file-fixer
        # Still excluding .svg now that svgo is gone: both SVGs were minified
        # by it and have no trailing newline, so lifting this would rewrite
        # two image files for no benefit.
        exclude: '\.svg$'
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # PyMarkdown rather than markdownlint-cli: the same MD### rules, but pure
  # Python. markdownlint-cli is a node hook, and pre-commit builds it by
  # npm-installing from a local git clone, which recent npm refuses
  # ("EALLOWGIT: Fetching non-root packages from git has been disabled").
  # That made the hook impossible to install locally, so this check only ever
  # ran in CI — which is how about.md reached master unlinted.
  #
  # `scan`, not a fix mode: PyMarkdown auto-fixes a narrower set of rules than
  # markdownlint --fix did (MD022 is not among them), so a fix mode would
  # rewrite the file, fail, and then fail again after re-staging. The
  # trailing-whitespace hook above already fixes the most common offender.
  #
  # Verified equivalent to markdownlint on this repo: with front-matter
  # handling enabled it reports exactly the same 7 findings on the unlinted
  # about.md and passes on all 37 markdown files once fixed.
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
      - id: pymarkdown
        args: [--config, .pymarkdown.json, scan]
