<!DOCTYPE html>
<html lang="en">
  {% include head.html %}

  <body>
  <!-- Viewport-locked splash so the [λ] logo always centers in the visible
       area, regardless of how tall/wide body grows. Inset from the viewport
       edges so the SVG doesn't push flush against the window frame. The
       moving announcement stacks directly above the logo.

       MOVING ANNOUNCEMENT: delete the <p class="move-note"> line below (and
       the matching .move-note rule in css/custom.css) once the move is
       complete (after 2026-09-01). -->
  <div class="splash">
    <p class="move-note" role="status">
      The Pearson Lab is moving to the <b>Center for Neural Science at NYU</b>
    </p>
    <img class="splash-logo" src="/images/plab_logo_dark.svg" alt="Pearson Lab">
  </div>
  {% include navbar.html %}

  <footer>
      <div style="display: block; position: fixed; bottom: 20px; left: 30px">
          <h3 style="color: #9d9d9d">{{ page.desc }}</h3>
      </div>
  </footer>
  {% include jsload.html %}
  </body>
</html>
